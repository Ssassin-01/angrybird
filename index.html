<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Angry Birds 2 - Stage 2 Slingshot</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.2), transparent 45%),
        linear-gradient(180deg, #14324a 0%, #08131d 100%);
      font-family: "Trebuchet MS", "Verdana", sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
    }

    .game-shell {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      width: 1280px;
      height: 720px;
      display: block;
      transform-origin: center center;
      touch-action: none;
      border-radius: 24px;
      box-shadow:
        0 36px 80px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      image-rendering: auto;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <!--
      width / height HTML 속성은 반드시 1280 x 720으로 고정합니다.
      화면 크기 변화는 CSS transform으로만 처리해야 좌표계가 흔들리지 않습니다.
    -->
    <canvas
      id="game-canvas"
      width="1280"
      height="720"
      aria-label="Modern Angry Birds 2 style physics playground"
    ></canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script>
    class AngryBirdsBootstrap {
      constructor() {
        // 게임의 기준 좌표계입니다. 이후 모든 배치 계산은 이 크기를 기준으로 진행합니다.
        this.width = 1280;
        this.height = 720;

        // DOM은 캔버스 하나만 사용하고, 모든 그래픽은 이 캔버스 안에서 그립니다.
        this.canvas = document.getElementById("game-canvas");

        // Matter.js 주요 모듈을 구조 분해해서 별칭으로 보관합니다.
        this.Engine = Matter.Engine;
        this.Render = Matter.Render;
        this.Runner = Matter.Runner;
        this.World = Matter.World;
        this.Bodies = Matter.Bodies;
        this.Body = Matter.Body;
        this.Constraint = Matter.Constraint;
        this.Mouse = Matter.Mouse;
        this.MouseConstraint = Matter.MouseConstraint;
        this.Events = Matter.Events;
        this.Vector = Matter.Vector;

        // 나중에 커스텀 렌더링으로 확장하기 쉽도록 엔진/렌더/러너를 멤버로 분리합니다.
        this.engine = null;
        this.world = null;
        this.render = null;
        this.runner = null;
        this.mouse = null;
        this.mouseConstraint = null;
        this.groundBody = null;
        this.launcherIslandBody = null;
        this.targetIslandBody = null;
        this.woodBodies = [];
        this.glassBodies = [];
        this.crateBodies = [];
        this.pigBodies = [];

        // requestAnimationFrame ID를 저장해 두면 추후 정지/재시작 제어가 쉬워집니다.
        this.renderFrameId = null;

        // 2단계부터는 새총 상호작용에 필요한 상태를 명확히 분리해 둡니다.
        // 새총 다리가 바닥에 자연스럽게 닿아 보이도록 앵커를 조금 더 아래로 내립니다.
        this.anchorPoint = { x: 250, y: 529 };
        this.birdRadius = 20;
        this.maxDragDistance = 100;
        this.launchPower = 0.18;
        this.trajectoryDotCount = 13;
        this.trajectoryStep = 5;
        this.isDraggingBird = false;
        this.hasBirdLaunched = false;
        this.bird = null;
        this.slingshotConstraint = null;
        this.pointerGrabPadding = 16;
        this.activePointerId = null;
        this.constraintIdleStiffness = 0.12;
        this.constraintDragStiffness = 0;
        this.pointerWorldPosition = {
          x: this.anchorPoint.x,
          y: this.anchorPoint.y
        };

        // MouseConstraint가 새만 집을 수 있도록 충돌 카테고리를 분리합니다.
        this.collisionCategories = {
          default: 0x0001,
          bird: 0x0002
        };

        this.transparentRender = {
          fillStyle: "rgba(0, 0, 0, 0)",
          strokeStyle: "rgba(0, 0, 0, 0)",
          lineWidth: 0
        };

        // 배경/테마 색상도 모아서 관리하면 이후 아트 교체가 편합니다.
        this.palette = {
          skyTop: "#69d8ff",
          skyMid: "#9ee8ff",
          skyBottom: "#d9fbff",
          islandGrass: "#7dde3a",
          islandShadow: "#235f3f",
          cliffLight: "#f6de9d",
          cliffMid: "#c1a16a",
          cliffDark: "#6c5d44",
          wood: "#c7843d",
          woodDark: "#7f4a25",
          glass: "rgba(176, 236, 255, 0.65)",
          pig: "#7fe14b",
          pigDark: "#3d9220",
          birdRed: "#db2a2a",
          uiGold: "#ffcc4a",
          uiGoldDark: "#c98717",
          uiPanel: "#435768",
          uiPanelDark: "#243543",
          stoneBlue: "#6ea9cb",
          mistWhite: "rgba(255,255,255,0.65)",
          leafDark: "#194f30",
          leafLight: "#7ce445",
          blossom: "#fff5e8"
        };

        // 실제 스프라이트 이미지를 한 번만 로드해두고, 이후 렌더링에서는
        // 이 캐시를 재사용합니다. 매 프레임 이미지를 다시 만들지 않도록
        // 미리 준비하는 것이 중요합니다.
        this.images = {};
        this.assetsLoaded = false;
        this.spriteSources = {
          red: "assets/images/characters/red.png",
          pig: "assets/images/characters/pig.png",
          blocks: "assets/images/objects/blocks.png",
          sky: "assets/images/ui/sky.png",
          tree: "assets/images/ui/tree.png",
          ground: "assets/images/ui/ground.png",
          ingameGround: "assets/images/ui/ingameground.png",
          parallax: "assets/images/ui/ingame_parallax.png"
        };

        // 실제 이미지들을 보니 캐릭터는 "가로 5칸 스트립", 구조물은
        // "8 x 5에 가까운 아틀라스" 형태였습니다.
        this.spriteFrames = {
          characters: {
            red: [],
            pig: []
          },
          objects: {}
        };
      }

      async init() {
        await this.loadVisualAssets();
        this.createEngine();
        this.createRenderer();
        this.createStaticWorld();
        this.createBirdAndSlingshot();
        this.createShowcaseObjects();
        this.createMouseController();
        this.registerInteractionEvents();
        this.bindResize();
        this.bindTouchGuards();
        this.bindPointerEvents();
        this.startSimulation();
      }

      async loadVisualAssets() {
        const entries = Object.entries(this.spriteSources);
        const loadedEntries = await Promise.all(
          entries.map(async ([key, src]) => [key, await this.loadImage(src)])
        );

        this.images = Object.fromEntries(loadedEntries);
        this.buildSpriteMetadata();
        this.assetsLoaded = true;
      }

      loadImage(src) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error(`이미지를 불러오지 못했습니다: ${src}`));
          image.src = src;
        });
      }

      buildSpriteMetadata() {
        const redSheet = this.images.red;
        const pigSheet = this.images.pig;
        const blockSheet = this.images.blocks;

        if (redSheet) {
          this.spriteFrames.characters.red = [
            { x: 22, y: 130, w: 111, h: 109 },
            { x: 133, y: 130, w: 128, h: 109 },
            { x: 273, y: 130, w: 126, h: 109 },
            { x: 399, y: 130, w: 133, h: 109 },
            { x: 532, y: 130, w: 101, h: 109 }
          ];
        }

        if (pigSheet) {
          this.spriteFrames.characters.pig = [
            { x: 10, y: 118, w: 120, h: 128 },
            { x: 142, y: 118, w: 121, h: 128 },
            { x: 274, y: 118, w: 121, h: 128 },
            { x: 404, y: 123, w: 126, h: 122 },
            { x: 539, y: 118, w: 121, h: 128 }
          ];
        }

        if (blockSheet) {

          // 상단 3개 행은 재질별(wood / ice / stone) 구조가 일정합니다.
          // 현재 스테이지는 목재와 얼음 기둥 위주이므로 필요한 칸만 이름으로 매핑합니다.
          this.spriteFrames.objects = {
            woodBeam: { x: 2276, y: 2394, w: 1098, h: 72 },
            woodBeamCore: { x: 2308, y: 2402, w: 1034, h: 56 },
            woodBeamClean: { x: 2368, y: 2400, w: 690, h: 56 },
            woodSquare: { x: 2038, y: 808, w: 196, h: 196 },
            iceBeam: { x: 2276, y: 2478, w: 1098, h: 78 },
            iceBeamCore: { x: 2308, y: 2488, w: 1034, h: 58 },
            iceBeamClean: { x: 2332, y: 2484, w: 700, h: 62 },
            iceColumnClean: { x: 2700, y: 2490, w: 120, h: 54 },
            iceSquare: { x: 548, y: 784, w: 312, h: 306 },
            stoneSquare: { x: 258, y: 594, w: 286, h: 286 }
          };
        }
      }

      createStripFrames(image, frameCount, crop = {}) {
        const frameWidth = image.width / frameCount;
        const xInset = frameWidth * (crop.xInsetRatio || 0);
        const yInset = image.height * (crop.yInsetRatio || 0);
        const width = frameWidth * (crop.widthRatio || 1);
        const height = image.height * (crop.heightRatio || 1);

        return Array.from({ length: frameCount }, (_, frameIndex) => ({
          x: frameIndex * frameWidth + xInset,
          y: yInset,
          w: width,
          h: height
        }));
      }

      createEngine() {
        // Matter.Engine은 물리 계산의 중심입니다.
        this.engine = this.Engine.create();
        this.world = this.engine.world;

        // 중력은 아래 방향(y+)으로 작용합니다.
        this.world.gravity.x = 0;
        this.world.gravity.y = 1.05;
      }

      createRenderer() {
        // Matter.Render는 현재 단계의 디버그/프로토타입 렌더러 역할입니다.
        // 나중에 이미지 기반 커스텀 렌더러로 바꿀 때도 render 인스턴스를 그대로 재사용할 수 있습니다.
        this.render = this.Render.create({
          canvas: this.canvas,
          engine: this.engine,
          options: {
            width: this.width,
            height: this.height,
            wireframes: false,
            background: "transparent",
            pixelRatio: 1
          }
        });

        // 기본 Matter 렌더 캔버스는 투명하게 유지해서,
        // 같은 캔버스 위에 우리가 직접 배경/장식 레이어를 깔 수 있게 합니다.
        this.render.canvas.style.background = "transparent";

        // 2단계 요구사항: afterRender에서 점선 궤적을 그릴 수 있도록 이벤트를 등록합니다.
        this.Events.on(this.render, "afterRender", () => {
          this.drawTrajectoryDots();
        });
      }

      createStaticWorld() {
        // 바닥: y 700 부근에서 전체 월드를 지지하는 큰 정적 바디입니다.
        const ground = this.Bodies.rectangle(this.width / 2, 710, 1500, 70, {
          isStatic: true,
          friction: 0.95,
          collisionFilter: {
            category: this.collisionCategories.default
          },
          render: this.transparentRender
        });

        // 좌우 벽, 천장은 물리 객체 이탈 방지용이라 완전히 투명하게 만듭니다.
        const leftWall = this.Bodies.rectangle(-25, this.height / 2, 50, this.height + 400, {
          isStatic: true,
          collisionFilter: {
            category: this.collisionCategories.default
          },
          render: this.transparentRender
        });

        const rightWall = this.Bodies.rectangle(this.width + 25, this.height / 2, 50, this.height + 400, {
          isStatic: true,
          collisionFilter: {
            category: this.collisionCategories.default
          },
          render: this.transparentRender
        });

        const ceiling = this.Bodies.rectangle(this.width / 2, -25, this.width + 400, 50, {
          isStatic: true,
          collisionFilter: {
            category: this.collisionCategories.default
          },
          render: this.transparentRender
        });

        // 발사대 섬의 시각 요소는 drawBackdropLayer에서 직접 그리고 있으므로,
        // 여기 물리 바디는 "입력을 방해하지 않을 정도로 낮고 얇게"만 둡니다.
        // 이렇게 하면 초록색 디버그 박스가 새를 당길 때 손에 걸리는 느낌을 주지 않습니다.
        const launcherIsland = this.Bodies.rectangle(230, 635, 260, 18, {
          isStatic: true,
          chamfer: { radius: 8 },
          collisionFilter: {
            category: this.collisionCategories.default
          },
          render: this.transparentRender
        });

        const targetIsland = this.Bodies.rectangle(980, 635, 430, 18, {
          isStatic: true,
          chamfer: { radius: 8 },
          collisionFilter: {
            category: this.collisionCategories.default
          },
          render: this.transparentRender
        });

        this.groundBody = ground;
        this.launcherIslandBody = launcherIsland;
        this.targetIslandBody = targetIsland;

        this.World.add(this.world, [
          ground,
          leftWall,
          rightWall,
          ceiling,
          launcherIsland,
          targetIsland
        ]);
      }

      createBirdAndSlingshot() {
        // 발사체는 앵커와 같은 위치에서 시작합니다.
        // 충돌 카테고리를 bird로 분리해 두면 MouseConstraint가 이 새만 집게 만들 수 있습니다.
        this.bird = this.Bodies.circle(
          this.anchorPoint.x,
          this.anchorPoint.y,
          this.birdRadius,
          {
            density: 0.004,
            restitution: 0.28,
            friction: 0.03,
            // 궤적 점선과 실제 비행 궤도를 최대한 일치시키기 위해 공기 저항은 제거합니다.
            // 그러면 x는 1차, y는 2차 식으로 예측이 가능해져 가벼운 계산으로도 정확도가 높아집니다.
            frictionAir: 0,
            collisionFilter: {
              category: this.collisionCategories.bird
            },
            render: this.transparentRender
          }
        );

        // Constraint가 실제 고무줄 역할을 합니다.
        // 길이(length)를 0으로 두면 앵커에 붙어 있다가 당겼을 때 탄성이 생깁니다.
        this.slingshotConstraint = this.Constraint.create({
          pointA: { x: this.anchorPoint.x, y: this.anchorPoint.y },
          bodyB: this.bird,
          stiffness: this.constraintIdleStiffness,
          damping: 0.04,
          length: 0,
          render: {
            visible: false
          }
        });

        this.World.add(this.world, [this.bird, this.slingshotConstraint]);
      }

      createShowcaseObjects() {
        // 타깃 구조물은 "가만히 있어도 무너지지 않는" 쪽으로 다시 배치합니다.
        // 기준선은 타깃 발판 윗면(686)이며, 모든 부품이 그 위에 자연스럽게 얹히도록 계산합니다.
        const platformTopY = 626;

        const leftColumn = this.Bodies.rectangle(919, 560, 10, 132, {
          chamfer: { radius: 3 },
          friction: 0.35,
          restitution: 0.08,
          collisionFilter: {
            category: this.collisionCategories.default
          },
          render: this.transparentRender
        });

        const rightColumn = this.Bodies.rectangle(1031, 560, 10, 132, {
          chamfer: { radius: 3 },
          friction: 0.35,
          restitution: 0.08,
          collisionFilter: {
            category: this.collisionCategories.default
          },
          render: this.transparentRender
        });

        const upperLeftColumn = this.Bodies.rectangle(944, 439, 10, 86, {
          chamfer: { radius: 3 },
          friction: 0.35,
          restitution: 0.08,
          collisionFilter: {
            category: this.collisionCategories.default
          },
          render: this.transparentRender
        });

        const upperRightColumn = this.Bodies.rectangle(1006, 439, 10, 86, {
          chamfer: { radius: 3 },
          friction: 0.35,
          restitution: 0.08,
          collisionFilter: {
            category: this.collisionCategories.default
          },
          render: this.transparentRender
        });

        const lowerBeam = this.Bodies.rectangle(975, 488, 122, 12, {
          chamfer: { radius: 3 },
          friction: 0.35,
          restitution: 0.08,
          collisionFilter: {
            category: this.collisionCategories.default
          },
          render: this.transparentRender
        });

        const midBeam = this.Bodies.rectangle(975, 391, 72, 10, {
          chamfer: { radius: 3 },
          friction: 0.35,
          restitution: 0.08,
          collisionFilter: {
            category: this.collisionCategories.default
          },
          render: this.transparentRender
        });

        const pigLarge = this.Bodies.circle(975, 454, 28, {
          restitution: 0.2,
          density: 0.0025,
          friction: 0.35,
          collisionFilter: {
            category: this.collisionCategories.default
          },
          render: this.transparentRender
        });

        const pigSmall = this.Bodies.circle(975, 362, 24, {
          restitution: 0.2,
          density: 0.002,
          friction: 0.35,
          collisionFilter: {
            category: this.collisionCategories.default
          },
          render: this.transparentRender
        });

        this.glassBodies = [
          leftColumn,
          rightColumn,
          upperLeftColumn,
          upperRightColumn
        ];
        this.woodBodies = [lowerBeam, midBeam];
        this.pigBodies = [pigLarge, pigSmall];
        this.crateBodies = [];

        // 블록은 생성 시점의 스프라이트 방향과 기준 크기를 고정합니다.
        // 충돌 후에 body.bounds가 회전 때문에 바뀌더라도, 렌더 프레임 타입이
        // 매번 바뀌지 않게 해서 "맞는 순간 다른 블록으로 돌아가 보이는" 문제를 줄입니다.
        this.attachBlockSprite(leftColumn, {
          frame: this.spriteFrames.objects.iceColumnClean,
          baseRotation: Math.PI / 2,
          material: "ice",
          width: 132,
          height: 10
        });
        this.attachBlockSprite(rightColumn, {
          frame: this.spriteFrames.objects.iceColumnClean,
          baseRotation: Math.PI / 2,
          material: "ice",
          width: 132,
          height: 10
        });
        this.attachBlockSprite(upperLeftColumn, {
          frame: this.spriteFrames.objects.iceColumnClean,
          baseRotation: Math.PI / 2,
          material: "ice",
          width: 86,
          height: 10
        });
        this.attachBlockSprite(upperRightColumn, {
          frame: this.spriteFrames.objects.iceColumnClean,
          baseRotation: Math.PI / 2,
          material: "ice",
          width: 86,
          height: 10
        });
        this.attachBlockSprite(lowerBeam, {
          frame: this.spriteFrames.objects.woodBeamClean,
          material: "wood",
          width: 122,
          height: 12
        });
        this.attachBlockSprite(midBeam, {
          frame: this.spriteFrames.objects.woodBeamClean,
          material: "wood",
          width: 72,
          height: 10
        });
        [...this.glassBodies, ...this.woodBodies].forEach((body) => {
          body.friction = 0.9;
          body.frictionStatic = 1;
          body.frictionAir = 0.02;
          body.restitution = 0.02;
          this.Body.setInertia(body, body.inertia * 2.8);
        });

        this.World.add(this.world, [
          leftColumn,
          rightColumn,
          upperLeftColumn,
          upperRightColumn,
          lowerBeam,
          midBeam,
          pigLarge,
          pigSmall
        ]);
      }

      createMouseController() {
        // Mouse는 현재 캔버스의 화면상 크기를 기준으로 좌표를 읽습니다.
        // 우리 게임은 HTML width/height는 고정이고 CSS만 스케일되므로,
        // 리사이즈 때마다 별도로 scale을 맞춰 줘야 드래그 좌표가 정확하게 들어옵니다.
        this.mouse = this.Mouse.create(this.canvas);
        this.updateMouseScale();

        this.mouseConstraint = this.MouseConstraint.create(this.engine, {
          mouse: this.mouse,
          collisionFilter: {
            mask: 0
          },
          constraint: {
            stiffness: 0.2,
            render: {
              visible: false
            }
          }
        });

        this.render.mouse = this.mouse;
        this.World.add(this.world, this.mouseConstraint);
      }

      registerInteractionEvents() {
        // 드래그 중 제한 로직:
        // 포인터 이벤트에서 저장해 둔 좌표를 새 위치에 직접 반영하되, 앵커 기준 반경 100px 원 안으로만 이동시킵니다.
        // 즉, 사용자가 멀리 드래그해도 실제 새는 고정 반경 경계까지만 따라옵니다.
        this.Events.on(this.engine, "beforeUpdate", () => {
          if (!this.isDraggingBird || this.hasBirdLaunched || !this.bird) {
            return;
          }

          this.slingshotConstraint.stiffness = this.constraintDragStiffness;
          this.moveBirdToPointer();

          // 드래그 중에는 사용자가 원하는 방향만 보이고 흔들림은 최소화되도록
          // 속도와 회전을 잠깐 0으로 고정합니다.
          this.Body.setVelocity(this.bird, { x: 0, y: 0 });
          this.Body.setAngularVelocity(this.bird, 0);
          this.Body.setAngle(this.bird, 0);
        });
      }

      bindResize() {
        // 캔버스 내부 해상도는 고정하고, CSS 크기만 조절하는 Letterbox 스케일링입니다.
        const resize = () => {
          const scale = Math.min(
            window.innerWidth / this.width,
            window.innerHeight / this.height
          );

          const scaledWidth = this.width * scale;
          const scaledHeight = this.height * scale;

          this.canvas.style.width = `${scaledWidth}px`;
          this.canvas.style.height = `${scaledHeight}px`;
          this.updateMouseScale();
        };

        resize();
        window.addEventListener("resize", resize);
      }

      bindTouchGuards() {
        // 모바일에서 캔버스를 손가락으로 당길 때
        // 브라우저의 기본 스크롤 / 새로고침 제스처가 끼어들지 않도록 막습니다.
        this.canvas.style.touchAction = "none";

        ["touchstart", "touchmove", "touchend", "touchcancel", "gesturestart", "gesturechange"].forEach((eventName) => {
          this.canvas.addEventListener(
            eventName,
            (event) => {
              event.preventDefault();
            },
            { passive: false }
          );
        });
      }

      bindPointerEvents() {
        // 실제 드래그 입력은 Pointer Events로 직접 처리합니다.
        // 이 방식은 마우스/터치/펜을 하나의 코드 경로에서 안정적으로 다룰 수 있어서
        // 모바일 터치 미동작 문제를 피하는 데 훨씬 유리합니다.
        this.canvas.addEventListener(
          "pointerdown",
          (event) => {
            if (this.hasBirdLaunched || !this.bird) {
              return;
            }

            event.preventDefault();
            this.updatePointerWorldPosition(event);

            if (!this.isPointerInsideBird(this.pointerWorldPosition)) {
              return;
            }

            this.activePointerId = event.pointerId;
            this.isDraggingBird = true;
            this.slingshotConstraint.stiffness = this.constraintDragStiffness;
            this.Body.setVelocity(this.bird, { x: 0, y: 0 });
            this.Body.setAngularVelocity(this.bird, 0);

            if (this.canvas.setPointerCapture) {
              this.canvas.setPointerCapture(event.pointerId);
            }

            this.moveBirdToPointer();
          },
          { passive: false }
        );

        this.canvas.addEventListener(
          "pointermove",
          (event) => {
            if (this.activePointerId !== null && event.pointerId !== this.activePointerId) {
              return;
            }

            event.preventDefault();
            this.updatePointerWorldPosition(event);

            if (this.isDraggingBird) {
              this.moveBirdToPointer();
            }
          },
          { passive: false }
        );

        const releasePointer = (event) => {
          if (this.activePointerId === null || event.pointerId !== this.activePointerId) {
            return;
          }

          event.preventDefault();
          this.updatePointerWorldPosition(event);
          this.activePointerId = null;

          if (this.canvas.releasePointerCapture && this.canvas.hasPointerCapture?.(event.pointerId)) {
            this.canvas.releasePointerCapture(event.pointerId);
          }

          if (!this.isDraggingBird || this.hasBirdLaunched) {
            return;
          }

          this.isDraggingBird = false;
          this.launchBird(this.getLaunchStateFromPosition(this.getClampedDragPosition()));
        };

        this.canvas.addEventListener("pointerup", releasePointer, { passive: false });
        this.canvas.addEventListener("pointercancel", releasePointer, { passive: false });
        this.canvas.addEventListener("lostpointercapture", () => {
          if (this.isDraggingBird && !this.hasBirdLaunched) {
            this.isDraggingBird = false;
            this.launchBird(this.getLaunchStateFromPosition(this.getClampedDragPosition()));
          }

          this.activePointerId = null;
        });
      }

      updateMouseScale() {
        if (!this.mouse) {
          return;
        }

        const bounds = this.canvas.getBoundingClientRect();

        if (!bounds.width || !bounds.height) {
          return;
        }

        this.Mouse.setScale(this.mouse, {
          x: this.width / bounds.width,
          y: this.height / bounds.height
        });

        this.Mouse.setOffset(this.mouse, { x: 0, y: 0 });
      }

      startSimulation() {
        // Runner는 물리 엔진 업데이트만 담당합니다.
        this.runner = this.Runner.create();
        this.Runner.run(this.runner, this.engine);

        // 렌더는 직접 requestAnimationFrame으로 감싸서,
        // Matter 디버그 렌더 + 커스텀 배경 드로잉을 한 캔버스에서 함께 처리합니다.
        const renderLoop = () => {
          this.Render.world(this.render);
          this.drawBackdropLayer();
          this.drawForegroundLayer();
          this.renderFrameId = window.requestAnimationFrame(renderLoop);
        };

        renderLoop();
      }

      drawBackdropLayer() {
        const ctx = this.render.context;

        // destination-over를 쓰면 이미 그려진 Matter 바디 뒤에 배경이 깔립니다.
        // 즉, 물리 객체는 그대로 두고 동일한 캔버스에서 하늘/섬 풍경을 뒤쪽 레이어로 추가할 수 있습니다.
        ctx.save();
        ctx.globalCompositeOperation = "destination-over";

        if (this.assetsLoaded && this.images.map) {
          this.drawSkySpriteBackdrop(ctx);
          this.drawSunGlow(ctx);
          this.drawFarIslands(ctx);
          this.drawAtmosphericMist(ctx);
        } else {
          const skyGradient = ctx.createLinearGradient(0, 0, 0, this.height);
          skyGradient.addColorStop(0, this.palette.skyTop);
          skyGradient.addColorStop(0.55, this.palette.skyMid);
          skyGradient.addColorStop(1, this.palette.skyBottom);
          ctx.fillStyle = skyGradient;
          ctx.fillRect(0, 0, this.width, this.height);

          this.drawSunGlow(ctx);
          this.drawSunBeams(ctx);
          this.drawCloudBank(ctx);
          this.drawFarIslands(ctx);
          this.drawAtmosphericMist(ctx);
          this.drawBackgroundHills(ctx);
          this.drawBackdropVegetation(ctx);
          this.drawGroundRibbon(ctx);
        }

        ctx.restore();
      }

      drawForegroundLayer() {
        const ctx = this.render.context;
        ctx.save();

        this.drawStageGround(ctx);
        this.drawLauncherIslandDecor(ctx);
        this.drawTargetIslandDecor(ctx);
        this.drawStructureArt(ctx);
        this.drawSlingshot(ctx);
        this.drawPauseButton(ctx);
        this.drawTopHudLabel(ctx);

        ctx.restore();
      }

      drawStageGround(ctx) {
        // 사용자가 바로 "땅"이라고 인식할 수 있도록,
        // 전면 레이어에 넓고 두꺼운 초원 지형을 직접 깝니다.
        // 이전처럼 배경 뒤에 살짝 비치는 느낌이 아니라, 오브젝트 아래를 실제로 받치는 바닥입니다.
        ctx.save();

        const dirt = ctx.createLinearGradient(0, 615, 0, this.height);
        dirt.addColorStop(0, "#b78444");
        dirt.addColorStop(0.25, "#98662f");
        dirt.addColorStop(1, "#5c3413");
        ctx.fillStyle = dirt;
        ctx.beginPath();
        ctx.moveTo(0, 620);
        ctx.quadraticCurveTo(160, 592, 315, 612);
        ctx.quadraticCurveTo(470, 584, 650, 616);
        ctx.quadraticCurveTo(870, 585, 1055, 610);
        ctx.quadraticCurveTo(1170, 592, 1280, 604);
        ctx.lineTo(1280, this.height);
        ctx.lineTo(0, this.height);
        ctx.closePath();
        ctx.fill();

        const grass = ctx.createLinearGradient(0, 580, 0, 646);
        grass.addColorStop(0, "#d9ff8a");
        grass.addColorStop(0.32, "#95e147");
        grass.addColorStop(0.7, "#5eb726");
        grass.addColorStop(1, "#3f8f1f");
        ctx.fillStyle = grass;
        ctx.beginPath();
        ctx.moveTo(0, 606);
        for (let x = 0; x <= this.width; x += 72) {
          ctx.quadraticCurveTo(x + 26, 590 + (x % 144 === 0 ? -10 : 8), x + 72, 606);
        }
        ctx.lineTo(this.width, 640);
        ctx.lineTo(0, 640);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#78d332";
        ctx.beginPath();
        ctx.ellipse(230, 628, 210, 46, -0.03, Math.PI, 0);
        ctx.ellipse(980, 626, 270, 50, 0.015, Math.PI, 0);
        ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.22)";
        ctx.beginPath();
        ctx.ellipse(220, 607, 118, 12, -0.04, 0, Math.PI * 2);
        ctx.ellipse(950, 606, 150, 13, 0.02, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(49, 98, 29, 0.28)";
        ctx.beginPath();
        ctx.ellipse(235, 653, 160, 18, 0, 0, Math.PI * 2);
        ctx.ellipse(980, 652, 245, 20, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      drawSunGlow(ctx) {
        const glow = ctx.createRadialGradient(930, 145, 30, 930, 145, 210);
        glow.addColorStop(0, "rgba(255, 255, 255, 0.95)");
        glow.addColorStop(0.18, "rgba(255, 247, 185, 0.65)");
        glow.addColorStop(0.45, "rgba(255, 247, 185, 0.18)");
        glow.addColorStop(1, "rgba(255, 247, 185, 0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(930, 145, 220, 0, Math.PI * 2);
        ctx.fill();
      }

      drawSunBeams(ctx) {
        ctx.save();
        ctx.translate(905, 120);
        ctx.rotate(-0.22);
        for (let index = 0; index < 5; index += 1) {
          ctx.fillStyle = `rgba(255, 255, 255, ${0.1 - index * 0.012})`;
          ctx.beginPath();
          ctx.moveTo(-20, 0);
          ctx.lineTo(330, -30 - index * 8);
          ctx.lineTo(330, 30 + index * 8);
          ctx.closePath();
          ctx.fill();
          ctx.rotate(0.17);
        }
        ctx.restore();
      }

      drawCloudBank(ctx) {
        const cloudShapes = [
          [250, 135, 140, 46, 0.28],
          [410, 95, 155, 52, 0.22],
          [735, 225, 110, 38, 0.2],
          [1080, 120, 170, 56, 0.16],
          [890, 315, 150, 48, 0.13],
          [1110, 460, 220, 72, 0.1]
        ];

        cloudShapes.forEach(([x, y, w, h, alpha]) => {
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.beginPath();
          ctx.ellipse(x, y, w, h, -0.2, 0, Math.PI * 2);
          ctx.fill();
        });

        const streak = ctx.createLinearGradient(0, 70, this.width, 310);
        streak.addColorStop(0, "rgba(255,255,255,0)");
        streak.addColorStop(0.35, "rgba(255,255,255,0.18)");
        streak.addColorStop(0.75, "rgba(255,255,255,0.06)");
        streak.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = streak;
        ctx.fillRect(0, 60, this.width, 250);
      }

      drawFarIslands(ctx) {
        ctx.save();
        ctx.globalAlpha = 0.22;

        [
          { x: 1020, y: 130, w: 210, h: 260 },
          { x: 1180, y: 80, w: 240, h: 330 },
          { x: 800, y: 390, w: 190, h: 180 }
        ].forEach((shape) => {
          const gradient = ctx.createLinearGradient(shape.x, shape.y, shape.x, shape.y + shape.h);
          gradient.addColorStop(0, "rgba(77, 182, 255, 0.55)");
          gradient.addColorStop(1, "rgba(42, 102, 175, 0.12)");
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.moveTo(shape.x, shape.y + 40);
          ctx.quadraticCurveTo(shape.x + shape.w * 0.45, shape.y - 20, shape.x + shape.w, shape.y + 40);
          ctx.lineTo(shape.x + shape.w * 0.65, shape.y + shape.h);
          ctx.lineTo(shape.x + shape.w * 0.35, shape.y + shape.h);
          ctx.closePath();
          ctx.fill();
        });

        ctx.restore();
      }

      drawAtmosphericMist(ctx) {
        ctx.save();
        const mist = ctx.createLinearGradient(0, 420, 0, this.height);
        mist.addColorStop(0, "rgba(255,255,255,0)");
        mist.addColorStop(0.45, "rgba(236, 252, 255, 0.22)");
        mist.addColorStop(1, "rgba(255,255,255,0.55)");
        ctx.fillStyle = mist;
        ctx.fillRect(0, 390, this.width, this.height - 390);
        ctx.restore();
      }

      drawBackgroundHills(ctx) {
        ctx.save();

        const backHill = ctx.createLinearGradient(0, 520, 0, 720);
        backHill.addColorStop(0, "rgba(95, 196, 122, 0.12)");
        backHill.addColorStop(1, "rgba(44, 118, 70, 0.52)");
        ctx.fillStyle = backHill;
        ctx.beginPath();
        ctx.moveTo(0, 610);
        ctx.quadraticCurveTo(150, 535, 320, 600);
        ctx.quadraticCurveTo(505, 540, 690, 612);
        ctx.quadraticCurveTo(875, 542, 1055, 606);
        ctx.quadraticCurveTo(1170, 555, 1280, 598);
        ctx.lineTo(1280, 720);
        ctx.lineTo(0, 720);
        ctx.closePath();
        ctx.fill();

        const frontHill = ctx.createLinearGradient(0, 590, 0, 720);
        frontHill.addColorStop(0, "rgba(126, 223, 95, 0.16)");
        frontHill.addColorStop(1, "rgba(55, 144, 66, 0.7)");
        ctx.fillStyle = frontHill;
        ctx.beginPath();
        ctx.moveTo(0, 654);
        ctx.quadraticCurveTo(130, 608, 270, 648);
        ctx.quadraticCurveTo(420, 606, 610, 654);
        ctx.quadraticCurveTo(760, 612, 945, 650);
        ctx.quadraticCurveTo(1110, 612, 1280, 648);
        ctx.lineTo(1280, 720);
        ctx.lineTo(0, 720);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      drawBackdropVegetation(ctx) {
        ctx.save();
        ctx.fillStyle = "rgba(16, 58, 38, 0.8)";
        this.drawTreeSilhouette(ctx, 35, 365, 1.2);
        this.drawTreeSilhouette(ctx, 1250, 118, 0.65);
        this.drawTreeSilhouette(ctx, 50, 165, 0.9);
        ctx.restore();
      }

      drawGroundRibbon(ctx) {
        ctx.save();
        // 하단 전체에 확실히 보이는 "초록 지면"을 깝니다.
        // 이전처럼 얇은 띠가 아니라, 멀리서 봐도 바로 땅이라고 느껴질 정도의 두께로 그립니다.
        const dirtGradient = ctx.createLinearGradient(0, 620, 0, this.height);
        dirtGradient.addColorStop(0, "#b9894b");
        dirtGradient.addColorStop(0.22, "#9f7038");
        dirtGradient.addColorStop(1, "#593414");
        ctx.fillStyle = dirtGradient;
        ctx.beginPath();
        ctx.moveTo(0, 632);
        ctx.quadraticCurveTo(150, 612, 300, 628);
        ctx.quadraticCurveTo(520, 604, 730, 632);
        ctx.quadraticCurveTo(980, 606, 1280, 628);
        ctx.lineTo(1280, this.height);
        ctx.lineTo(0, this.height);
        ctx.closePath();
        ctx.fill();

        const grassGradient = ctx.createLinearGradient(0, 590, 0, 650);
        grassGradient.addColorStop(0, "#d5ff86");
        grassGradient.addColorStop(0.35, "#91df44");
        grassGradient.addColorStop(1, "#4e9e24");
        ctx.fillStyle = grassGradient;
        ctx.beginPath();
        ctx.moveTo(0, 622);
        for (let x = 0; x <= this.width; x += 80) {
          ctx.quadraticCurveTo(x + 35, 600 + (x % 160 === 0 ? -10 : 8), x + 80, 622);
        }
        ctx.lineTo(this.width, 658);
        ctx.lineTo(0, 658);
        ctx.closePath();
        ctx.fill();

        // 좌우 플레이 구역 아래에 잔디 둔덕을 더 얹어서
        // 새총과 구조물이 바닥 위에 박혀 있는 느낌을 강화합니다.
        const moundGradient = ctx.createLinearGradient(0, 585, 0, 675);
        moundGradient.addColorStop(0, "#bfff78");
        moundGradient.addColorStop(0.45, "#6dc92e");
        moundGradient.addColorStop(1, "#3e881f");
        ctx.fillStyle = moundGradient;
        ctx.beginPath();
        ctx.ellipse(235, 635, 180, 44, -0.03, Math.PI, 0);
        ctx.ellipse(980, 633, 260, 48, 0.02, Math.PI, 0);
        ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.22)";
        ctx.beginPath();
        ctx.ellipse(250, 620, 120, 12, -0.04, 0, Math.PI * 2);
        ctx.ellipse(955, 618, 155, 14, 0.01, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(53, 108, 34, 0.32)";
        ctx.beginPath();
        ctx.ellipse(245, 650, 150, 18, 0, 0, Math.PI * 2);
        ctx.ellipse(980, 650, 230, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      drawIslandBase(ctx, x, y, width, height) {
        const left = x - width / 2;
        const top = y - height / 2;

        const cliffGradient = ctx.createLinearGradient(left, top, left, top + height);
        cliffGradient.addColorStop(0, this.palette.cliffLight);
        cliffGradient.addColorStop(0.45, this.palette.cliffMid);
        cliffGradient.addColorStop(1, this.palette.cliffDark);

        ctx.fillStyle = cliffGradient;
        ctx.beginPath();
        ctx.moveTo(left + 36, top + 15);
        ctx.bezierCurveTo(left - 10, top + 55, left + 35, top + 120, left + 58, top + height - 25);
        ctx.bezierCurveTo(left + width * 0.35, top + height + 25, left + width * 0.65, top + height + 10, left + width - 34, top + height - 22);
        ctx.bezierCurveTo(left + width - 10, top + 135, left + width + 10, top + 48, left + width - 22, top + 12);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "rgba(69, 50, 28, 0.45)";
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = "rgba(73, 90, 122, 0.22)";
        ctx.beginPath();
        ctx.ellipse(x + width * 0.14, top + height * 0.5, width * 0.18, 44, -0.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = this.palette.islandGrass;
        ctx.beginPath();
        ctx.moveTo(left + 12, top + 18);
        ctx.quadraticCurveTo(x, top - 22, left + width - 12, top + 18);
        ctx.quadraticCurveTo(x, top + 52, left + 12, top + 18);
        ctx.fill();

        ctx.fillStyle = "rgba(183, 255, 143, 0.7)";
        ctx.beginPath();
        ctx.ellipse(x - width * 0.12, top + 16, width * 0.2, 10, -0.06, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(40, 103, 56, 0.26)";
        ctx.beginPath();
        ctx.ellipse(x - 20, top + 60, width * 0.26, 18, -0.12, 0, Math.PI * 2);
        ctx.fill();
      }

      drawLauncherIslandDecor(ctx) {
        this.drawFlowerCluster(ctx, 172, 679, 0.9);
        this.drawFlowerCluster(ctx, 308, 682, 0.75);
        this.drawBush(ctx, 118, 684, 1.08);
        this.drawBush(ctx, 168, 657, 0.72);
        this.drawGrassTuft(ctx, 274, 679, 1.1);
      }

      drawTargetIslandDecor(ctx) {
        this.drawFlowerCluster(ctx, 846, 684, 1.05);
        this.drawFlowerCluster(ctx, 1106, 685, 1.05);
        this.drawFlowerCluster(ctx, 1196, 690, 0.95);
        this.drawBush(ctx, 920, 688, 0.9);
        this.drawBush(ctx, 1062, 664, 0.7);
        this.drawGrassTuft(ctx, 1006, 682, 1.25);
        this.drawDecorativeRoof(ctx, 975, 334);
        this.drawBalloonCluster(ctx, 872, 474, 0.95);
      }

      drawStructureArt(ctx) {
        this.crateBodies.forEach((body) => this.drawCrate(ctx, body));
        this.glassBodies.forEach((body) => this.drawGlassBlock(ctx, body));
        this.woodBodies.forEach((body) => this.drawWoodBlock(ctx, body));
        this.pigBodies.forEach((body, index) => this.drawPig(ctx, body, index === 1));
      }

      drawSlingshot(ctx) {
        const x = this.anchorPoint.x - 34;
        const y = this.anchorPoint.y + 58;
        const birdPosition = this.bird ? this.bird.position : this.anchorPoint;

        ctx.save();
        ctx.translate(x, y);

        // 새총 끈은 앵커가 살아 있을 때만 그립니다.
        // 당기고 있을 때는 끈이 현재 새 위치를 따라오고, 발사 후에는 사라집니다.
        if (this.slingshotConstraint && !this.hasBirdLaunched) {
          ctx.strokeStyle = "#2e1404";
          ctx.lineWidth = 10;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(8, -132);
          ctx.lineTo(birdPosition.x - x, birdPosition.y - y);
          ctx.lineTo(38, -134);
          ctx.stroke();

          ctx.strokeStyle = "#5a2d10";
          ctx.lineWidth = 6;
          ctx.lineCap = "round";

          ctx.beginPath();
          ctx.moveTo(8, -132);
          ctx.lineTo(birdPosition.x - x, birdPosition.y - y);
          ctx.lineTo(38, -134);
          ctx.stroke();

          ctx.fillStyle = "#3c2415";
          ctx.beginPath();
          this.drawRoundedRect(
            ctx,
            birdPosition.x - x - 16,

          );
          ctx.fill();
        }

        ctx.lineCap = "round";

        ctx.beginPath();

      launchBird(launchState = this.getLaunchState()) {
        if (!this.bird || !this.slingshotConstraint || this.hasBirdLaunched) {
          return;
        }

        this.World.remove(this.world, this.slingshotConstraint);
        this.slingshotConstraint = null;
        this.hasBirdLaunched = true;

        // 발사 후에는 다시 잡히지 않도록 충돌 카테고리를 기본값으로 바꿉니다.
        this.bird.collisionFilter.category = this.collisionCategories.default;

        // 점선 궤적 계산에 사용한 위치/속도를 실제 발사에도 그대로 사용합니다.
        // 이렇게 하면 "예상 경로"와 "실제 첫 프레임"의 기준값이 완전히 같아집니다.
        this.Body.setPosition(this.bird, launchState.position);
        this.Body.setAngle(this.bird, 0);
        this.Body.setAngularVelocity(this.bird, 0);
        this.bird.force.x = 0;
        this.bird.force.y = 0;
        this.bird.torque = 0;
        this.Body.setVelocity(this.bird, launchState.velocity);
      }

      moveBirdToPointer() {
        if (!this.bird) {
          return;
        }

        const dragPosition = this.getClampedDragPosition();
        this.Body.setPosition(this.bird, dragPosition);
      }

      clampBirdToAnchorRadius() {
        if (!this.bird) {
          return;
        }

        const pullVector = this.Vector.sub(this.bird.position, this.anchorPoint);
        const currentDistance = this.Vector.magnitude(pullVector);

        if (currentDistance <= this.maxDragDistance) {
          return;
        }

        const clampedPosition = this.Vector.add(
          this.anchorPoint,
          this.Vector.mult(
            this.Vector.normalise(pullVector),
            this.maxDragDistance
          )
        );

        this.Body.setPosition(this.bird, clampedPosition);
      }

      isPointerInsideBird(pointerPosition = this.pointerWorldPosition) {
        if (!this.bird) {
          return false;
        }

        const pointerVector = this.Vector.sub(pointerPosition, this.bird.position);
        const pointerDistance = this.Vector.magnitude(pointerVector);

        return pointerDistance <= this.birdRadius + this.pointerGrabPadding;
      }

      updatePointerWorldPosition(event) {
        this.pointerWorldPosition = this.screenToWorldPosition(event.clientX, event.clientY);
      }

      screenToWorldPosition(clientX, clientY) {
        const bounds = this.canvas.getBoundingClientRect();

        return {
          x: ((clientX - bounds.left) / bounds.width) * this.width,
          y: ((clientY - bounds.top) / bounds.height) * this.height
        };
      }

      getLaunchVelocity() {
        const launchPosition = this.isDraggingBird
          ? this.getClampedDragPosition()
          : (this.bird ? this.bird.position : this.anchorPoint);
        const stretchVector = this.Vector.sub(this.anchorPoint, launchPosition);

        return {
          x: stretchVector.x * this.launchPower,
          y: stretchVector.y * this.launchPower
        };
      }

      getLaunchState() {
        const position = this.isDraggingBird
          ? this.getClampedDragPosition()
          : (this.bird ? { x: this.bird.position.x, y: this.bird.position.y } : this.anchorPoint);

        return this.getLaunchStateFromPosition(position);
      }

      getLaunchStateFromPosition(position) {
        return {
          position: {
            x: position.x,
            y: position.y
          },
          velocity: this.getLaunchVelocityFromPosition(position)
        };
      }

      getLaunchVelocityFromPosition(position) {
        const stretchVector = this.Vector.sub(this.anchorPoint, position);

        return {
          x: stretchVector.x * this.launchPower,
          y: stretchVector.y * this.launchPower
        };
      }

      getClampedDragPosition(position = this.pointerWorldPosition) {
        const pullVector = this.Vector.sub(position, this.anchorPoint);
        const currentDistance = this.Vector.magnitude(pullVector);

        if (currentDistance <= this.maxDragDistance) {
          return {
            x: position.x,
            y: position.y
          };
        }

        return this.Vector.add(
          this.anchorPoint,
          this.Vector.mult(
            this.Vector.normalise(pullVector),
            this.maxDragDistance
          )
        );
      }

      drawTrajectoryDots() {
        // 요구사항:
        // 발사 전에만, 그리고 사용자가 실제로 새를 당기고 있는 동안에만 점선을 보여 줍니다.
        // 발사 후에는 즉시 숨겨야 하므로 hasBirdLaunched 상태를 같이 확인합니다.
        if (!this.isDraggingBird || this.hasBirdLaunched || !this.bird) {
          return;
        }

        const ctx = this.render.context;
        const launchState = this.getLaunchState();
        const start = launchState.position;
        const velocity = launchState.velocity;
        const previewBody = this.Bodies.circle(start.x, start.y, this.birdRadius, {
          frictionAir: this.bird.frictionAir
        });

        // 점선과 실제 발사가 같은 적분 규칙을 따르도록,
        // 임시 body 하나에 실제 발사와 동일한 위치/속도를 넣고 Body.update를 반복합니다.
        // 월드 전체를 복제하는 무거운 방식이 아니라 body 하나의 수학 상태만 따라가는 방식이라 가볍습니다.
        this.Body.setPosition(previewBody, start);
        this.Body.setVelocity(previewBody, velocity);

        ctx.save();

        for (let index = 1; index <= this.trajectoryDotCount; index += 1) {
          for (let subStep = 0; subStep < this.trajectoryStep; subStep += 1) {
            previewBody.force.x =
              previewBody.mass *
              this.engine.world.gravity.x *
              this.engine.world.gravity.scale;
            previewBody.force.y =
              previewBody.mass *
              this.engine.world.gravity.y *
              this.engine.world.gravity.scale;

            this.Body.update(previewBody, this.Body._baseDelta);

            previewBody.force.x = 0;
            previewBody.force.y = 0;
            previewBody.torque = 0;
          }

          // 화면 밖 점은 굳이 더 그리지 않아도 되므로 조기 종료합니다.
          if (
            previewBody.position.x < 0 ||
            previewBody.position.x > this.width ||
            previewBody.position.y > this.height
          ) {
            break;
          }

          const radius = Math.max(1.8, 5 - index * 0.22);
          const alpha = Math.max(0.16, 0.9 - index * 0.055);

          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.beginPath();
          ctx.arc(previewBody.position.x, previewBody.position.y, radius, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      drawBackdropLayer() {
        const ctx = this.render.context;
        ctx.save();
        ctx.globalCompositeOperation = "destination-over";

        if (this.assetsLoaded && this.images.sky) {
          this.drawSkySpriteBackdrop(ctx);
          this.drawImageSlice(ctx, this.images.tree, 0, 690, this.images.tree.width, 170, 0, 460, this.width, 82, 0.12, "darken");
          this.drawImageSlice(ctx, this.images.parallax, 0, 228, this.images.parallax.width, 78, 0, 534, this.width, 34, 0.16, "darken");
        } else {
          const skyGradient = ctx.createLinearGradient(0, 0, 0, this.height);
          skyGradient.addColorStop(0, this.palette.skyTop);
          skyGradient.addColorStop(0.55, this.palette.skyMid);
          skyGradient.addColorStop(1, this.palette.skyBottom);
          ctx.fillStyle = skyGradient;
          ctx.fillRect(0, 0, this.width, this.height);

          this.drawSunGlow(ctx);
          this.drawSunBeams(ctx);
          this.drawCloudBank(ctx);
          this.drawFarIslands(ctx);
          this.drawAtmosphericMist(ctx);
          this.drawBackgroundHills(ctx);
          this.drawBackdropVegetation(ctx);
          this.drawGroundRibbon(ctx);
        }

        ctx.restore();
      }

      drawStageGround(ctx) {
        ctx.save();

        if (this.assetsLoaded && this.images.ground) {
          ctx.fillStyle = "#6a4a24";
          ctx.fillRect(0, 646, this.width, this.height - 646);

          this.drawImageSlice(ctx, this.images.ingameGround, 411, 0, 411, 342, 0, 622, this.width, 46, 1);
          this.drawImageSlice(ctx, this.images.ground, 0, 820, this.images.ground.width, 180, 0, 602, this.width, 118, 1);

          ctx.fillStyle = "rgba(26, 39, 64, 0.14)";
          ctx.beginPath();
          ctx.ellipse(230, 646, 152, 18, 0, 0, Math.PI * 2);
          ctx.ellipse(980, 646, 244, 20, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          const dirt = ctx.createLinearGradient(0, 615, 0, this.height);
          dirt.addColorStop(0, "#b78444");
          dirt.addColorStop(0.25, "#98662f");
          dirt.addColorStop(1, "#5c3413");
          ctx.fillStyle = dirt;
          ctx.beginPath();
          ctx.moveTo(0, 620);
          ctx.quadraticCurveTo(160, 592, 315, 612);
          ctx.quadraticCurveTo(470, 584, 650, 616);
          ctx.quadraticCurveTo(870, 585, 1055, 610);
          ctx.quadraticCurveTo(1170, 592, 1280, 604);
          ctx.lineTo(1280, this.height);
          ctx.lineTo(0, this.height);
          ctx.closePath();
          ctx.fill();

          const grass = ctx.createLinearGradient(0, 580, 0, 646);
          grass.addColorStop(0, "#d9ff8a");
          grass.addColorStop(0.32, "#95e147");
          grass.addColorStop(0.7, "#5eb726");
          grass.addColorStop(1, "#3f8f1f");
          ctx.fillStyle = grass;
          ctx.beginPath();
          ctx.moveTo(0, 606);
          for (let x = 0; x <= this.width; x += 72) {
            ctx.quadraticCurveTo(x + 26, 590 + (x % 144 === 0 ? -10 : 8), x + 72, 606);
          }
          ctx.lineTo(this.width, 640);
          ctx.lineTo(0, 640);
          ctx.closePath();
          ctx.fill();
        }

        ctx.restore();
      }

      drawLauncherIslandDecor(ctx) {
        if (this.assetsLoaded && this.images.parallax) {
          return;
        }

        this.drawFlowerCluster(ctx, 172, 679, 0.9);
        this.drawFlowerCluster(ctx, 308, 682, 0.75);
        this.drawBush(ctx, 118, 684, 1.08);
        this.drawBush(ctx, 168, 657, 0.72);
        this.drawGrassTuft(ctx, 274, 679, 1.1);
      }

      drawTargetIslandDecor(ctx) {
        if (this.assetsLoaded && this.images.parallax) {
          this.drawDecorativeRoof(ctx, 975, 292);
          return;
        }

        this.drawFlowerCluster(ctx, 846, 684, 1.05);
        this.drawFlowerCluster(ctx, 1106, 685, 1.05);
        this.drawFlowerCluster(ctx, 1196, 690, 0.95);
        this.drawBush(ctx, 920, 688, 0.9);
        this.drawBush(ctx, 1062, 664, 0.7);
        this.drawGrassTuft(ctx, 1006, 682, 1.25);
        this.drawDecorativeRoof(ctx, 975, 292);
        this.drawBalloonCluster(ctx, 872, 474, 0.95);
      }

      drawBird(ctx, position) {
        if (this.assetsLoaded && this.images.red && this.spriteFrames.characters.red.length) {
          const speed = this.bird ? this.Vector.magnitude(this.bird.velocity) : 0;
          let frameIndex = 0;

          if (this.hasBirdLaunched) {
            frameIndex = speed > 14 ? 2 : 3;
          } else if (this.isDraggingBird) {
            frameIndex = 1;
          }

          const frame = this.spriteFrames.characters.red[frameIndex] || this.spriteFrames.characters.red[0];
          const size = this.hasBirdLaunched ? 64 : 60;
          const rotation = this.hasBirdLaunched && this.bird ? this.bird.angle : 0;
          const aspect = frame.w / Math.max(frame.h, 1);
          const width = aspect >= 1 ? size : size * aspect;
          const height = aspect >= 1 ? size / aspect : size;

          // 스프라이트를 정사각형으로 억지로 눌러 그리지 않고,
          // 실제 프레임 비율을 유지한 채 가장 긴 변만 목표 크기에 맞춥니다.
          // 이렇게 해야 새의 머리/몸통이 위아래로 찌부되지 않습니다.
          this.drawSpriteCentered(
            ctx,
            this.images.red,
            frame,
            position.x,
            position.y - 1,
            width,
            height,
            rotation
          );
          return;
        }

        ctx.save();
        ctx.translate(position.x, position.y);
        ctx.fillStyle = this.palette.birdRed;
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      drawPig(ctx, body, hasHat = false) {
        if (this.assetsLoaded && this.images.pig && this.spriteFrames.characters.pig.length) {
          const frameIndex = hasHat ? 1 : 0;
          const frame = this.spriteFrames.characters.pig[frameIndex] || this.spriteFrames.characters.pig[0];
          const radius = body.circleRadius || 24;
          const size = radius * 2.18;
          const aspect = frame.w / Math.max(frame.h, 1);
          const width = aspect >= 1 ? size : size * aspect;
          const height = aspect >= 1 ? size / aspect : size;

          this.drawSpriteCentered(
            ctx,
            this.images.pig,
            frame,
            body.position.x,
            body.position.y - 1,
            width,
            height,
            body.angle
          );

          if (hasHat) {
            ctx.save();
            ctx.translate(body.position.x, body.position.y - radius - 12);
            ctx.fillStyle = "#efc057";
            ctx.beginPath();
            ctx.moveTo(-14, 2);
            ctx.lineTo(14, 2);
            ctx.lineTo(0, -12);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
          return;
        }

        ctx.save();
        ctx.translate(body.position.x, body.position.y);
        ctx.fillStyle = this.palette.pig;
        ctx.beginPath();
        ctx.arc(0, 0, body.circleRadius || 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      drawGlassBlock(ctx, body) {
        if (this.assetsLoaded && this.images.blocks) {
          const frame = body.spriteMeta?.frame || this.getBlockFrame(body, "ice");
          this.drawStructureSprite(ctx, body, frame);
          return;
        }

        this.drawBodyRect(ctx, body, (width, height) => {
          const gradient = ctx.createLinearGradient(-width / 2, -height / 2, width / 2, height / 2);
          gradient.addColorStop(0, "rgba(215, 250, 255, 0.95)");
          gradient.addColorStop(0.45, "rgba(147, 225, 248, 0.82)");
          gradient.addColorStop(1, "rgba(91, 174, 210, 0.88)");
          ctx.fillStyle = gradient;
          ctx.beginPath();
          this.drawRoundedRect(ctx, -width / 2, -height / 2, width, height, 6);
          ctx.fill();
        });
      }

      drawWoodBlock(ctx, body) {
        if (this.assetsLoaded && this.images.blocks) {
          const frame = body.spriteMeta?.frame || this.getBlockFrame(body, "wood");
          this.drawStructureSprite(ctx, body, frame);
          return;
        }

        this.drawBodyRect(ctx, body, (width, height) => {
          ctx.fillStyle = "#c7843d";
          ctx.beginPath();
          this.drawRoundedRect(ctx, -width / 2, -height / 2, width, height, 6);
          ctx.fill();
        });
      }

      drawCrate(ctx, body) {
        if (this.assetsLoaded && this.images.blocks) {
          const frame = body.spriteMeta?.frame || this.spriteFrames.objects.woodSquare;
          this.drawStructureSprite(ctx, body, frame);
          return;
        }

        this.drawBodyRect(ctx, body, (width, height) => {
          ctx.fillStyle = "#d89645";
          ctx.beginPath();
          this.drawRoundedRect(ctx, -width / 2, -height / 2, width, height, 5);
          ctx.fill();
        });
      }

      drawSkySpriteBackdrop(ctx) {
        this.drawImageCover(ctx, this.images.sky, 0, 0, this.width, this.height, 1);
      }

      attachBlockSprite(body, spriteMeta) {
        body.spriteMeta = {
          frame: spriteMeta.frame,
          baseRotation: spriteMeta.baseRotation || 0,
          material: spriteMeta.material || "generic",
          width: spriteMeta.width,
          height: spriteMeta.height
        };
      }

      drawImageCover(ctx, image, x, y, width, height, alpha = 1) {
        if (!image) {
          return;
        }

        const scale = Math.max(width / image.width, height / image.height);
        const drawWidth = image.width * scale;
        const drawHeight = image.height * scale;
        const offsetX = x + (width - drawWidth) / 2;
        const offsetY = y + (height - drawHeight) / 2;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.drawImage(image, offsetX, offsetY, drawWidth, drawHeight);
        ctx.restore();
      }

      drawImageSlice(
        ctx,
        image,
        sourceX,
        sourceY,
        sourceWidth,
        sourceHeight,
        x,
        y,
        width,
        height,
        alpha = 1,
        compositeOperation = "source-over"
      ) {
        if (!image) {
          return;
        }

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.globalCompositeOperation = compositeOperation;
        ctx.drawImage(
          image,
          sourceX,
          sourceY,
          sourceWidth,
          sourceHeight,
          x,
          y,
          width,
          height
        );
        ctx.restore();
      }

      getBlockFrame(body, material) {
        const width = body.spriteMeta?.width || (body.bounds.max.x - body.bounds.min.x);
        const height = body.spriteMeta?.height || (body.bounds.max.y - body.bounds.min.y);
        const ratio = width / Math.max(height, 1);

        if (material === "ice") {
          if (ratio > 1.65) {
            return this.spriteFrames.objects.iceBeam;
          }
          return this.spriteFrames.objects.iceSquare;
        }

        if (ratio > 1.65) {
          return this.spriteFrames.objects.woodBeam;
        }
        return this.spriteFrames.objects.woodSquare;
      }

      drawStructureSprite(ctx, body, frame) {
        if (!frame || !this.images.blocks) {
          return;
        }

        const width = body.spriteMeta?.width || (body.bounds.max.x - body.bounds.min.x);
        const height = body.spriteMeta?.height || (body.bounds.max.y - body.bounds.min.y);
        const rotation = body.angle + (body.spriteMeta?.baseRotation || 0);
        const isVerticalIce = body.spriteMeta?.material === "ice" && Math.abs(body.spriteMeta?.baseRotation || 0) > 0.1;
        const safeFrame = isVerticalIce
          ? this.createInsetFrame(frame, 1, 1)
          : this.createInsetFrame(frame, 1, 1);

        // 블록 스프라이트는 하나의 atlas 안에 바짝 붙어 있기 때문에,
        // 축소/회전 렌더링을 하면 옆 타일 픽셀이 섞여 들어올 수 있습니다.
        // 얼음 기둥에서 다른 텍스처가 이어져 보이던 현상을 막기 위해
        // 가장자리를 살짝 안쪽으로 깎은 프레임만 사용하고 smoothing도 끕니다.
        this.drawSpriteCentered(
          ctx,
          this.images.blocks,
          safeFrame,
          body.position.x,
          body.position.y,
          width,
          height,
          rotation,
          true
        );
        this.drawStructureOutline(ctx, body.position.x, body.position.y, width, height, rotation, body.spriteMeta?.material);
      }

      drawImageFrame(ctx, image, frame, x, y, width, height) {
        ctx.drawImage(image, frame.x, frame.y, frame.w, frame.h, x, y, width, height);
      }

      drawSpriteCentered(ctx, image, frame, x, y, width, height, rotation = 0, disableSmoothing = false) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        if (disableSmoothing) {
          ctx.imageSmoothingEnabled = false;
        }
        this.drawImageFrame(ctx, image, frame, -width / 2, -height / 2, width, height);
        ctx.restore();
      }

      createInsetFrame(frame, insetX = 0, insetY = 0) {
        return {
          x: frame.x + insetX,
          y: frame.y + insetY,
          w: Math.max(1, frame.w - insetX * 2),
          h: Math.max(1, frame.h - insetY * 2)
        };
      }

      drawStructureOutline(ctx, x, y, width, height, rotation, material = "generic") {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);

        if (material === "ice") {
          ctx.strokeStyle = "rgba(65, 104, 137, 0.88)";
          ctx.lineWidth = 2;
        } else if (material === "wood") {
          ctx.strokeStyle = "rgba(108, 63, 24, 0.9)";
          ctx.lineWidth = 2;
        } else {
          ctx.strokeStyle = "rgba(0, 0, 0, 0.35)";
          ctx.lineWidth = 1.5;
        }

        ctx.beginPath();
        ctx.rect(-width / 2, -height / 2, width, height);
        ctx.stroke();
        ctx.restore();
      }

      drawRoundedRect(ctx, x, y, width, height, radius) {
        const safeRadius = Math.min(radius, width / 2, height / 2);
        ctx.moveTo(x + safeRadius, y);
        ctx.lineTo(x + width - safeRadius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + safeRadius);
        ctx.lineTo(x + width, y + height - safeRadius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - safeRadius, y + height);
        ctx.lineTo(x + safeRadius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - safeRadius);
        ctx.lineTo(x, y + safeRadius);
        ctx.quadraticCurveTo(x, y, x + safeRadius, y);
        ctx.closePath();
      }
    }

    const game = new AngryBirdsBootstrap();
    game.init();
  </script>
</body>
</html>
