<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Angry Birds 2 - Stage 2 Slingshot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-shell">
    <!--
      width / height HTML 속성은 반드시 1280 x 720으로 고정합니다.
      화면 크기 변화는 CSS transform으로만 처리해야 좌표계가 흔들리지 않습니다.
    -->
    <canvas
      id="game-canvas"
      width="1280"
      height="720"
      aria-label="Modern Angry Birds 2 style physics playground"
    ></canvas>
  </div>

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script defer src="scripts/angry-birds-core.js"></script>
  <script defer src="scripts/angry-birds-world.js"></script>
  <script defer src="scripts/angry-birds-render.js"></script>
  <script defer src="scripts/angry-birds-gameplay.js"></script>
  <script defer src="game.js"></script>
</body>
</html>
